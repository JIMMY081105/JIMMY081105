<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 126" width="1200" height="126" role="img" aria-label="Programming languages in neon cyberpunk style">
  <title>Programming Languages</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#070b16"/><stop offset=".5" stop-color="#10132b"/><stop offset="1" stop-color="#0a0d18"/></linearGradient>
    <filter id="g1" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.chip{fill:#0b1322;stroke:#263753;stroke-width:1.2}.t{fill:#eef4ff;font-size:12px}.s{fill:#7190aa;font-size:10px;letter-spacing:2.1px}.pulse{animation:p 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.crawl{animation:c 5.5s linear infinite}@keyframes p{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}@keyframes c{to{stroke-dashoffset:-70}}@media(prefers-reduced-motion:reduce){.pulse,.crawl{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="126" rx="14" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="1199" height="125" rx="13.5" fill="none" stroke="#253653"/>
  <g class="m">
    <text x="24" y="27" class="s">LANGUAGE GRID / ACTIVE CHANNELS</text>
    <path d="M25 42 H1175" stroke="#24324b" stroke-width="1.2"/>
    <path d="M25 42 H1175" stroke="#52e7ff" stroke-width="1.6" stroke-dasharray="18 52" class="crawl" opacity=".7" filter="url(#g1)"/>

    <g transform="translate(22,57)">
      <g transform="translate(0,0)"><rect class="chip" width="79" height="36" rx="18"/><circle cx="16" cy="18" r="5" fill="#ffb24d" class="pulse"/><text class="t" x="29" y="22">JAVA</text></g>
      <g transform="translate(88,0)"><rect class="chip" width="124" height="36" rx="18"/><circle cx="16" cy="18" r="5" fill="#f7df1e"/><text class="t" x="29" y="22">JAVASCRIPT</text></g>
      <g transform="translate(221,0)"><rect class="chip" width="96" height="36" rx="18"/><circle cx="16" cy="18" r="5" fill="#4fdcff" class="pulse"/><text class="t" x="29" y="22">PYTHON</text></g>
      <g transform="translate(326,0)"><rect class="chip" width="57" height="36" rx="18"/><circle cx="16" cy="18" r="5" fill="#97a9ca"/><text class="t" x="29" y="22">C</text></g>
      <g transform="translate(392,0)"><rect class="chip" width="73" height="36" rx="18"/><circle cx="16" cy="18" r="5" fill="#7f9cff"/><text class="t" x="29" y="22">C++</text></g>
      <g transform="translate(474,0)"><rect class="chip" width="81" height="36" rx="18"/><circle cx="16" cy="18" r="5" fill="#ad78ff" class="pulse"/><text class="t" x="29" y="22">JULIA</text></g>
      <g transform="translate(564,0)"><rect class="chip" width="80" height="36" rx="18"/><circle cx="16" cy="18" r="5" fill="#ff744f"/><text class="t" x="29" y="22">HTML</text></g>
      <g transform="translate(653,0)"><rect class="chip" width="74" height="36" rx="18"/><circle cx="16" cy="18" r="5" fill="#4f97ff"/><text class="t" x="29" y="22">CSS</text></g>
      <g transform="translate(736,0)"><rect class="chip" width="72" height="36" rx="18"/><circle cx="16" cy="18" r="5" fill="#56d9b7"/><text class="t" x="29" y="22">SQL</text></g>
      <g transform="translate(817,0)"><rect class="chip" width="74" height="36" rx="18"/><circle cx="16" cy="18" r="5" fill="#9c87ff"/><text class="t" x="29" y="22">PHP</text></g>
      <g transform="translate(900,0)"><rect class="chip" width="87" height="36" rx="18"/><circle cx="16" cy="18" r="5" fill="#67d79a"/><text class="t" x="29" y="22">SHELL</text></g>
      <g transform="translate(996,0)"><rect class="chip" width="130" height="36" rx="18"/><circle cx="16" cy="18" r="5" fill="#ff56d8" class="pulse"/><text class="t" x="29" y="22">MARKDOWN</text></g>
    </g>

    <text x="24" y="113" fill="#667b95" font-size="9.5" letter-spacing="1.5">JAVA · JAVASCRIPT · PYTHON · C · C++ · JULIA · HTML · CSS · SQL · PHP · SHELL · MARKDOWN</text>
    <text x="1175" y="113" fill="#ff66dd" font-size="9.5" text-anchor="end" letter-spacing="1.6">12 CHANNELS ONLINE</text>
  </g>
</svg>
