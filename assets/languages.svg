<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 118" width="1200" height="118" role="img" aria-label="Programming languages">
  <title>Programming Languages</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A0F1B"/><stop offset="0.5" stop-color="#101426"/><stop offset="1" stop-color="#0A0F1B"/>
    </linearGradient>
    <style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.dot{animation:p 2.4s ease-in-out infinite}@keyframes p{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.dot{animation:none}}</style>
  </defs>
  <rect width="1200" height="118" rx="14" fill="url(#bg)" stroke="#242E43"/>
  <g class="m">
    <text x="24" y="28" fill="#66728A" font-size="10" letter-spacing="2.6">PROGRAMMING LANGUAGE BUS</text>
    <line x1="24" y1="40" x2="1176" y2="40" stroke="#232B3E"/>

    <g font-size="12" fill="#E7EBF7">
      <g transform="translate(26 0)"><circle cx="7" cy="72" r="5" fill="#FFB44A" class="dot"/><text x="20" y="76">JAVA</text></g>
      <g transform="translate(121 0)"><circle cx="7" cy="72" r="5" fill="#F7DF1E"/><text x="20" y="76">JAVASCRIPT</text></g>
      <g transform="translate(263 0)"><circle cx="7" cy="72" r="5" fill="#6FE7FF"/><text x="20" y="76">PYTHON</text></g>
      <g transform="translate(367 0)"><circle cx="7" cy="72" r="5" fill="#93A4C7"/><text x="20" y="76">C</text></g>
      <g transform="translate(421 0)"><circle cx="7" cy="72" r="5" fill="#8FAAFF"/><text x="20" y="76">C++</text></g>
      <g transform="translate(496 0)"><circle cx="7" cy="72" r="5" fill="#B38CFF"/><text x="20" y="76">JULIA</text></g>
      <g transform="translate(586 0)"><circle cx="7" cy="72" r="5" fill="#FF7E55"/><text x="20" y="76">HTML</text></g>
      <g transform="translate(674 0)"><circle cx="7" cy="72" r="5" fill="#6EA8FF"/><text x="20" y="76">CSS</text></g>
      <g transform="translate(754 0)"><circle cx="7" cy="72" r="5" fill="#58D6B4"/><text x="20" y="76">SQL</text></g>
      <g transform="translate(827 0)"><circle cx="7" cy="72" r="5" fill="#9B8AFF"/><text x="20" y="76">PHP</text></g>
      <g transform="translate(904 0)"><circle cx="7" cy="72" r="5" fill="#7DD3A7"/><text x="20" y="76">SHELL</text></g>
      <g transform="translate(1001 0)"><circle cx="7" cy="72" r="5" fill="#A8B3C8"/><text x="20" y="76">MARKDOWN</text></g>
    </g>
    <text x="24" y="102" fill="#5F6A80" font-size="9.5" letter-spacing="1.4">LANGUAGE_SET / PERSONAL + REPOSITORY USAGE</text>
    <text x="1176" y="102" fill="#5F6A80" font-size="9.5" text-anchor="end">12 CHANNELS</text>
  </g>
</svg>
