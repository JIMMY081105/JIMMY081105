<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#203444" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#203444"/>
      <stop offset="0.5" stop-color="#78e7ff"/>
      <stop offset="0.82" stop-color="#203444"/>
      <stop offset="1" stop-color="#203444" stop-opacity="0"/>
    </linearGradient>
    <style>
