name: Live profile

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_profile.py"
      - ".github/workflows/live-profile.yml"

permissions:
  contents: write

concurrency:
  group: live-profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py dist

      - name: Check generated files
        run: |
          for f in stats-dark.svg stats-light.svg; do
            test -s "dist/$f" || { echo "missing or empty: dist/$f"; exit 1; }
            grep -q "<svg" "dist/$f" || { echo "not an SVG: dist/$f"; exit 1; }
          done

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
          commit_message: "Refresh live profile assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
